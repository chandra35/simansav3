<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="$(refresh-timeout-secs)">
  <title>Status Hotspot MAN 1 Metro</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <main class="page">
    <section class="status-wrap">
      <div class="status-card">
        <div class="status-head">
          <div class="brand-logo"><img src="assets/logo.png" alt="Logo MAN 1 Metro"></div>
          <div>
            <h1>Terhubung</h1>
            <p>Akun hotspot aktif di jaringan MAN 1 Metro.</p>
          </div>
        </div>

        <div class="status-body">
          <div class="stats">
            <div class="stat"><span>Username</span><strong>$(username)</strong></div>
            <div class="stat"><span>IP Address</span><strong>$(ip)</strong></div>
            <div class="stat"><span>MAC Address</span><strong>$(mac)</strong></div>
            <div class="stat"><span>Waktu Aktif</span><strong>$(uptime)</strong></div>
            <div class="stat"><span>Download</span><strong>$(bytes-out-nice)</strong></div>
            <div class="stat"><span>Upload</span><strong>$(bytes-in-nice)</strong></div>
          </div>

          <div class="actions">
            <a class="button primary" href="$(link-status)">Refresh Status</a>
            <a class="button" href="$(link-logout)">Logout</a>
          </div>

          <div class="help-box">
            <span>Bantuan</span>
            <a href="mailto:admin@man1metro.sch.id">admin@man1metro.sch.id</a>
          </div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
